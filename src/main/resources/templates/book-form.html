<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${book.id == 0} ? 'Add Book - Library Inventory' : 'Edit Book - Library Inventory'">Library Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f4f8; min-height: 100vh; }
        .navbar { background-color: #29234f; }
        .form-container { max-width: 650px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .page-title { color: #29234f; }
        .btn-purple { background-color: #29234f; color: white; }
        .btn-purple:hover { background-color: #403673; color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/Books/book}">Library Book Inventory</a>
    </div>
</nav>
<main class="container">
    <section class="form-container">
        <h2 class="page-title mb-4" th:text="${book.id == 0} ? 'Add New Book' : 'Edit Book'"></h2>
        <form th:action="${book.id == 0} ? @{/Books/addBook} : @{/Books/updateBook}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input id="title" type="text" th:field="*{title}" class="form-control" maxlength="255" required>
            </div>
            <div class="mb-3">
                <label for="author" class="form-label">Author</label>
                <input id="author" type="text" th:field="*{author}" class="form-control" maxlength="255" required>
            </div>
            <div class="mb-3">
                <label for="genre" class="form-label">Genre</label>
                <input id="genre" type="text" th:field="*{genre}" class="form-control" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="isbn" class="form-label">ISBN</label>
                <input id="isbn" type="text" th:field="*{isbn}" class="form-control" maxlength="20" required>
            </div>
            <div class="mb-4">
                <label for="isAvailable" class="form-label">Availability</label>
                <select id="isAvailable" th:field="*{isAvailable}" class="form-select" required>
                    <option value="true">Available</option>
                    <option value="false">Checked Out</option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-purple">Save Book</button>
                <a th:href="@{/Books/book}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
