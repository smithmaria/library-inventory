<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Library Inventory - Book Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f8;
            min-height: 100vh;
        }

        .navbar {
            background-color: #29234f;
        }

        .page-title {
            color: #29234f;
            font-weight: 600;
        }

        .btn-purple {
            background-color: #29234f;
            color: white;
        }

        .btn-purple:hover {
            background-color: #403673;
            color: white;
        }

        .table thead {
            --bs-table-bg: #29234f;
            --bs-table-color: white;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/Books/book}">
            Library Book Inventory
        </a>

        <form th:action="@{/logout}" method="post">
            <button type="submit" th:href="@{/login}"
                    class="btn btn-outline-light">
                Logout
            </button>
        </form>

    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <h2 class="page-title">Book Catalog</h2>

        <a th:href="@{/Books/viewAddForm}"
           class="btn btn-purple">
            + Add New Book
        </a>

    </div>

    <div class="table-container">

        <div class="table-responsive">

            <table class="table table-striped
                          table-hover align-middle">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Genre</th>
                    <th>ISBN</th>
                    <th>Availability</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <!-- Display books from MySQL -->
                <tr th:each="book : ${books}">

                    <td th:text="${book.id}"></td>

                    <td th:text="${book.title}"></td>

                    <td th:text="${book.author}"></td>

                    <td th:text="${book.genre}"></td>

                    <td th:text="${book.isbn}"></td>

                    <!-- Availability -->
                    <td>
                        <span th:if="${book.isAvailable}"
                              class="badge bg-success">
                            Available
                        </span>

                        <span th:unless="${book.isAvailable}"
                              class="badge bg-secondary">
                            Checked Out
                        </span>
                    </td>

                    <!-- Edit and Delete Buttons -->
                    <td>
                        <div class="d-flex gap-2">

                            <a th:href="@{/Books/viewUpdateForm(bookId=${book.id})}"
                               class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <a th:href="@{/Books/delete(bookId=${book.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this book?');">
                                Delete
                            </a>

                        </div>
                    </td>

                </tr>

                <!-- No Books Message -->
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="7"
                        class="text-center text-muted py-4">
                        No books are currently in the catalog.
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>
</div>

</body>
</html>
