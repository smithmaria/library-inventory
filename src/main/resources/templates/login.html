<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Library Inventory - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f8;
            min-height: 100vh;
        }

        .navbar, .card-header {
            background-color: #29234f;
        }

        .login-card {
            max-width: 430px;
            margin: 90px auto;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }

        .card-header {
            padding: 25px;
            color: white;
            text-align: center;
        }

        .btn-login {
            background-color: #29234f;
            color: white;
        }

        .btn-login:hover {
            background-color: #403673;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand" th:href="@{/index}">Library Book Inventory</span>
    </div>
</nav>

<div class="container">
    <div class="card login-card">

        <div class="card-header">
            <h3>Library Inventory</h3>
            <p class="mb-0">Secure Login</p>
        </div>

        <div class="card-body p-4">

            <h5 class="text-center mb-4">Welcome Back</h5>

            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have successfully logged out.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username"
                           class="form-control"
                           placeholder="Enter username"
                           autocomplete="username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control"
                           placeholder="Enter password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-login w-100 py-2">
                    Log In
                </button>

            </form>
        </div>

        <div class="card-footer text-center text-muted">
            Library Management System
        </div>
    </div>
</div>

</body>
</html>
